# Architecture template
architecture:

  style: <style>

  gateway: <gateway>

  authentication: <authentication>

  authorization: <authorization>

  communication: <communication>

  database: <database>  

  cache: <cache>

  queue: <queue>

  storage: <storage>

  external_services: <external_services>

# Example: 
# architecture:
#   style: Microservices
#   gateway: API Gateway
#   authentication: JWT
#   authorization: RBAC
#   communication: REST
#   database: PostgreSQL
#   cache: Redis
#   queue: RabbitMQ
#   storage: S3
#   external_services: External Services