# Component inventory template

components:
  - id: <component_id>
    name: <component_name>
    type: <component_type>
    repository: <component_repository>  
    branch: <component_branch>

    path: <component_path>

    owner: <component_owner>

    description: <component_description>

# Example: 
# components:
#   - id: cleverdent
#     name: CleverDent
#     type: Backend
#     repository: https://github.com/cleverdent/cleverdent
#     branch: main
#     path: src/backend
#     owner: Clever Team
#     description: Dental Management Platform