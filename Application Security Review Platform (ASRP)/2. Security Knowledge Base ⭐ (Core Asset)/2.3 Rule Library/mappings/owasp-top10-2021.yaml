owasp_top10_2021_mapping:
  "A01:2021-Broken Access Control":
    description: "Lỗi kiểm soát truy cập (BOLA, IDOR, Path Traversal, Missing Authorization)"
    rule_ids: ["ASRP-AUTH-001", "ASRP-PATH-001", "ASRP-AI-001"]
  "A02:2021-Cryptographic Failures":
    description: "Lỗi mã hóa (Sử dụng thuật toán yếu MD5/SHA1, Hardcoded Secret/Key)"
    rule_ids: ["ASRP-CRYPTO-001", "ASRP-SEC-003"]
  "A03:2021-Injection":
    description: "Lỗi chèn dữ liệu độc hại (SQL Injection, Command Injection, XSS)"
    rule_ids: ["ASRP-INJ-001", "ASRP-INJ-002", "ASRP-XSS-001"]
  "A04:2021-Insecure Design":
    description: "Thiết kế không an toàn (Thiếu Rate Limit, Business Logic Flaws)"
    rule_ids: ["ASRP-AI-002"]
  "A05:2021-Security Misconfiguration":
    description: "Cấu hình sai bảo mật (Debug Mode, Container Running as Root, S3 Bucket Public)"
    rule_ids: ["ASRP-MISCFG-001", "ASRP-TRIVY-001", "ASRP-TRIVY-002", "ASRP-IAC-001"]
  "A06:2021-Vulnerable and Outdated Components":
    description: "Thư viện phụ thuộc và linh kiện hết hạn/dính lỗ hổng CVE"
    rule_ids: ["ASRP-SCA-001"]
  "A07:2021-Identification and Authentication Failures":
    description: "Lỗi xác thực và rò rỉ bí mật (Hardcoded Tokens, Weak JWT, No Auth Verification)"
    rule_ids: ["ASRP-SEC-001", "ASRP-SEC-002", "ASRP-SEC-004", "ASRP-AUTH-002"]
  "A08:2021-Software and Data Integrity Failures":
    description: "Lỗi toàn vẹn dữ liệu và phần mềm (Insecure Deserialization)"
    rule_ids: ["ASRP-DESER-001"]
  "A09:2021-Security Logging and Monitoring Failures":
    description: "Lỗi ghi log và giám sát bảo mật (Rò rỉ thông tin nhạy cảm vào Log)"
    rule_ids: ["ASRP-LOG-001"]
  "A10:2021-Server-Side Request Forgery":
    description: "Lỗi giả mạo yêu cầu từ phía máy chủ (SSRF)"
    rule_ids: ["ASRP-SSRF-001"]
