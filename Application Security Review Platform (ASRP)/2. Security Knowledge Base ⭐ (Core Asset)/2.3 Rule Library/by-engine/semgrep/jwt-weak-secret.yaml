rule:
  id: "ASRP-AUTH-001"
  name: "JWT Weak Secret or Algorithm None Vulnerability"
  description: "Phát hiện JWT Token sử dụng secret bị hardcode/yếu hoặc cho phép thuật toán 'none' cho phép giả mạo chữ ký xác thực."
  severity: "critical"
  engine: "semgrep"
  category: "authentication"
  
  applicable_technologies:
    languages: ["python", "javascript", "typescript", "go", "java"]
    frameworks: ["express", "nestjs", "django", "fastapi", "gin", "spring-boot"]
  
  standard_mapping:
    owasp_top10_2021: ["A07:2021-Identification and Authentication Failures"]
    cwe: ["CWE-347", "CWE-345"]
    asvs_v4: ["V3.5.1", "V3.5.2"]

  knowledge_ref: "knowledge/domains/authentication.md"
  
  engine_config:
    semgrep_patterns:
      - language: "javascript"
        pattern: "jwt.sign($PAYLOAD, 'secret')"
      - language: "typescript"
        pattern: "jwt.sign($PAYLOAD, 'secret')"
      - language: "python"
        pattern: "jwt.encode($PAYLOAD, 'secret', algorithm='HS256')"
      - language: "go"
        pattern: "jwt.NewWithClaims(jwt.SigningMethodNone, ...)"
      - language: "java"
        pattern: "Jwts.builder().setSubject(...).signWith(SignatureAlgorithm.NONE, ...)"
    
  remediation:
    summary: "Tuyệt đối không hardcode secret JWT trong mã nguồn. Sử dụng biến môi trường (ENV) với độ dài secret tối thiểu 256 bits (HMAC-SHA256) hoặc cặp khóa RSA/ECDSA."
    reference_url: "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet_for_Java.html"
