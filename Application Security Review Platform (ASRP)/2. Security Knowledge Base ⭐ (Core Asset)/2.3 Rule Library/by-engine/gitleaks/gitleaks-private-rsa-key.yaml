rule:
  id: "ASRP-SEC-003"
  name: "Hardcoded Private RSA/SSH Key"
  description: "Phát hiện file Private Key hoặc chuỗi PEM RSA Key bị đưa trực tiếp vào kho mã nguồn."
  severity: "critical"
  engine: "gitleaks"
  category: "secrets"
  
  applicable_technologies:
    languages: ["all"]
    frameworks: ["all"]
  
  standard_mapping:
    owasp_top10_2021: ["A02:2021-Cryptographic Failures", "A07:2021-Identification and Authentication Failures"]
    cwe: ["CWE-321"]
    asvs_v4: ["V6.4.1"]

  knowledge_ref: "knowledge/domains/cryptography.md"
  
  engine_config:
    gitleaks_rule_id: "private-key"
    regex: '-----BEGIN[ A-Z0-9_-]+PRIVATE KEY-----'
    
  remediation:
    summary: "Xóa Private Key khỏi Git history (dùng git-filter-repo/bfg), sinh key pair mới và đưa key vào Vault/KMS."
    reference_url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
