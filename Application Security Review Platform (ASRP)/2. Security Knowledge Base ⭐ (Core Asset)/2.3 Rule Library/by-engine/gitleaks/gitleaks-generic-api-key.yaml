rule:
  id: "ASRP-SEC-001"
  name: "Hardcoded Generic API Key"
  description: "Phát hiện API key hoặc secret token bị hardcode trực tiếp trong mã nguồn."
  severity: "high"
  engine: "gitleaks"
  category: "secrets"
  
  applicable_technologies:
    languages: ["all"]
    frameworks: ["all"]
  
  standard_mapping:
    owasp_top10_2021: ["A07:2021-Identification and Authentication Failures"]
    cwe: ["CWE-798"]
    asvs_v4: ["V14.2.1"]

  knowledge_ref: "knowledge/domains/secrets-management.md"
  
  engine_config:
    gitleaks_rule_id: "generic-api-key"
    regex: '(?i)(api_key|apikey|secret_key)\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}["'']'
    
  remediation:
    summary: "Loại bỏ secret ra khỏi mã nguồn và quản lý qua biến môi trường (.env) hoặc Secret Manager."
    reference_url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
