standard_id: ASRP-STD-ISO-27001-2022
name: ISO/IEC 27001:2022 Information Security Management System - Annex A Controls
version: 2022
description: International standard for information security management system controls.

controls:
  - control_id: A.5.15
    title: Access Control
    description: Control physical and logical access to information and other associated assets based on business requirements.

  - control_id: A.8.25
    title: Secure Coding
    description: Establish secure coding principles and apply them to software development processes (SAST & AI Audit).

  - control_id: A.8.28
    title: Secure System Architecture and Engineering Principles
    description: Principles for engineering secure systems established, documented, and applied to all software architecture components.
