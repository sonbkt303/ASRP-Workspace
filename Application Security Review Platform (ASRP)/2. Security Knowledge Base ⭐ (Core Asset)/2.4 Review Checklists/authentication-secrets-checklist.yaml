checklist_id: ASRP-CHK-AUTH-001
name: Authentication & Secrets Management Checklist
domain: 2.2.1 Authentication & Secrets
applicable_technologies: [nestjs, python, nodejs, go, java, secrets]
standard_references:
  owasp_top10_2021: [A07:2021-Identification and Authentication Failures]
  cwe: [CWE-798, CWE-259, CWE-321]
  asvs_v4: [V2.1.1, V14.2.1]

checklist_items:
  - item_id: AUTH-CHK-01
    title: Hardcoded Secrets and API Keys
    verification_requirement: Check that no API keys, OAuth client secrets, private RSA keys, or DB passwords are hardcoded in source code files or default fallback variables.
    severity: CRITICAL
    rule_mapping: ASRP-SEC-004

  - item_id: AUTH-CHK-02
    title: Strong Password Storage & Cryptographic Hashing
    verification_requirement: Ensure user password hashes utilize modern salted algorithms (bcrypt, Argon2id, PBKDF2) instead of legacy MD5/SHA1 algorithms.
    severity: HIGH
    rule_mapping: ASRP-CRYPTO-001
