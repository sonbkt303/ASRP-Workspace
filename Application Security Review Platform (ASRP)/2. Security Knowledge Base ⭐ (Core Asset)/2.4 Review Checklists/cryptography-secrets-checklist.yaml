checklist_id: ASRP-CHK-CRYPTO-001
name: Cryptography & Secrets Management Security Checklist
domain: 2.2.5 Cryptography & 2.2.6 Secrets Management
applicable_technologies: [kms, hashicorp-vault, nodejs, python, java, go, aws-secrets-manager]
standard_references:
  owasp_top10_2021: [A02:2021-Cryptographic Failures, A07:2021-Identification and Authentication Failures]
  cwe: [CWE-311, CWE-312, CWE-326, CWE-327, CWE-798]
  asvs_v4: [V6.1.1, V6.2.1, V6.4.1, V14.2.1]

checklist_items:
  - item_id: CRYPTO-CHK-01
    title: Cryptographic Algorithm Selection & Key Length
    verification_requirement: Verify application uses approved cryptographic algorithms (AES-256-GCM, RSA 3072+, ECC SECP256R1, SHA-256/512) and avoids weak algorithms (DES, 3DES, RC4, MD5, SHA1).
    severity: HIGH
    rule_mapping: ASRP-CRYPTO-001

  - item_id: CRYPTO-CHK-02
    title: Secret Key Storage & Rotation Mechanism
    verification_requirement: Ensure encryption keys, JWT signing keys, and cloud credentials are dynamically fetched from secure Vault/KMS at runtime with automatic rotation policies.
    severity: CRITICAL
    rule_mapping: ASRP-SEC-004

  - item_id: CRYPTO-CHK-03
    title: Cryptographic Nonce & Initialization Vector (IV) Uniqueness
    verification_requirement: Verify symmetric encryption modes (GCM, CBC) generate cryptographically random, non-repeating IVs for every encryption operation.
    severity: HIGH
    rule_mapping: ASRP-CRYPTO-001
