guide_id: ASRP-REM-FRONTEND-001
name: React & Next.js Frontend Security Remediation Guide
version: 2.0.0
applicable_stack: [react, nextjs, typescript, pnpm, frontend]

remediations:
  - rem_id: REM-FRONTEND-001
    rule_id: ASRP-MISCFG-003
    guideline_ref: SCG-REACT-001
    target_vulnerability: React StrictMode Disabled in All Frontend Packages
    severity: HIGH
    cwe: [CWE-1188]
    owasp_top10: [A05:2021-Security Misconfiguration]
    asvs_control: V14.2.1
    priority_sla: 7d
    summary: "Bật reactStrictMode: true trong tất cả các tệp next.config.js."
    code_diff: |
      - reactStrictMode: false
      + reactStrictMode: true

  - rem_id: REM-FRONTEND-002
    rule_id: ASRP-AI-002
    guideline_ref: SCG-REACT-002
    target_vulnerability: TypeScript Build Error Suppression Enabled in Dashboard
    severity: MEDIUM
    cwe: [CWE-703]
    owasp_top10: [A05:2021-Security Misconfiguration]
    asvs_control: V14.2.2
    priority_sla: 30d
    summary: Loại bỏ ignoreBuildErrors và khắc phục các lỗi TypeScript.
    code_diff: |
      - typescript: { ignoreBuildErrors: true }
      + typescript: { ignoreBuildErrors: false }

  - rem_id: REM-FRONTEND-003
    rule_id: ASRP-AI-NEW-002
    guideline_ref: SCG-REACT-003
    target_vulnerability: Missing HTTP Security Headers in Frontend Applications
    severity: MEDIUM
    cwe: [CWE-16, CWE-693]
    owasp_top10: [A05:2021-Security Misconfiguration]
    asvs_control: V14.4.3
    priority_sla: 30d
    summary: Bổ sung CSP, X-Frame-Options, X-Content-Type-Options, HSTS headers trong next.config.js.
    code_diff: |
      - async headers() { return [{ source: '/(.*)', headers: [{ key: 'Cache-Control', value: 'public' }] }]; }
      + async headers() {
      +   return [{
      +     source: '/(.*)',
      +     headers: [
      +       { key: 'X-Frame-Options', value: 'SAMEORIGIN' },
      +       { key: 'X-Content-Type-Options', value: 'nosniff' },
      +       { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' },
      +       { key: 'Strict-Transport-Security', value: 'max-age=31536000; includeSubDomains' }
      +     ]
      +   }];
      + }

  - rem_id: REM-FRONTEND-004
    rule_id: ASRP-XSS-001
    guideline_ref: SCG-REACT-001
    target_vulnerability: DOM-Based Cross-Site Scripting via Unsanitized Next.js Props
    severity: HIGH
    cwe: [CWE-79]
    owasp_top10: [A03:2021-Injection]
    asvs_control: V5.3.3
    priority_sla: 7d
    summary: Sử dụng thư viện DOMPurify để làm sạch HTML payload trước khi chèn vào dangerouslySetInnerHTML.
    code_diff: |
      - <div dangerouslySetInnerHTML={{ __html: userContent }} />
      + import DOMPurify from 'isomorphic-dompurify';
      + const sanitizedContent = DOMPurify.sanitize(userContent);
      + <div dangerouslySetInnerHTML={{ __html: sanitizedContent }} />

  - rem_id: REM-FRONTEND-005
    rule_id: ASRP-PROTO-001
    guideline_ref: SCG-REACT-004
    target_vulnerability: Client-Side Prototype Pollution via Object Merge
    severity: HIGH
    cwe: [CWE-1321]
    owasp_top10: [A03:2021-Injection]
    asvs_control: V5.3.4
    priority_sla: 7d
    summary: Loại bỏ các thuộc tính nguy hiểm (__proto__, constructor, prototype) trước khi thực hiện deep merge object.
    code_diff: |
      - const target = Object.assign({}, source);
      + const sanitizeKeys = (obj) => {
      +   const clean = Array.isArray(obj) ? [] : {};
      +   for (let key in obj) {
      +     if (['__proto__', 'constructor', 'prototype'].includes(key)) continue;
      +     clean[key] = typeof obj[key] === 'object' ? sanitizeKeys(obj[key]) : obj[key];
      +   }
      +   return clean;
      + };
      + const target = sanitizeKeys(source);
