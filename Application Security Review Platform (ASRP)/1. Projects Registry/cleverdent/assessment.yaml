assessment:
  project_id: cleverdent
  standards:
    - OWASP Top 10
    - OWASP ASVS L1
  security_domains:
    - Authentication
    - Authorization
    - Secrets Management
    - Dependency Management
    - API Security
  rule_set_ids:
    - owasp-top10-2021
    - python-secure-coding
  tools_enabled:
    sast: true
    sca: true
    secrets: true
    iac: false
    dast: false
  severity_threshold: low
  ai:
    enabled: false
    focus_domains:
      - Authentication
      - API Security
  output:
    formats:
      - markdown
      - json
