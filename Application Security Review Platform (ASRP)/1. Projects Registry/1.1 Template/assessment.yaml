# Assessment template
assessment:
  project_id: ""
  standards: []
  security_domains: []
  rule_set_ids: []
  tools_enabled:
    sast: true
    sca: true
    secrets: true
    iac: false
    dast: false
  severity_threshold: low
  ai:
    enabled: false
    focus_domains: []
  output:
    formats:
      - markdown
      - json

