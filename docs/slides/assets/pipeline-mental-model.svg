<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" fill="none">
  <rect width="920" height="360" rx="12" fill="#0f172a"/>
  <text x="460" y="26" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Mental Model — 5 b??c · m?i b??c có m?c ?ích rõ ràng</text>

