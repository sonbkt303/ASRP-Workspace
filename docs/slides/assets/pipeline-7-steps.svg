  <rect x="40" y="160" width="840" height="150" rx="12" fill="#111b2e" stroke="#2a3a55"/>
  <text x="60" y="188" fill="#f59e0b" font-family="Segoe UI" font-size="12" font-weight="700">  Step 3  Mandatory gate</text>
  <text x="60" y="212" fill="#e2e8f0" font-family="Segoe UI" font-size="12">Engine does NOT scan unless lifecycle_status = validated</text>
  <text x="60" y="240" fill="#94a3b8" font-family="Segoe UI" font-size="11">CLI: asrp validate --project {id}</text>
  <text x="60" y="268" fill="#7dd3fc" font-family="Consolas, monospace" font-size="10">cleverdent/runs/run-*/findings.json · security_review_report.html</text>
